name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra intoto

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: No-key demo smoke test
        run: bash scripts/demo.sh
