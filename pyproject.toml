[project]
name = "provenance-aware-rag"
version = "0.1.0"
description = "Cryptographically enforceable trust for OKF knowledge bundles, checked at the point an agent consumes a concept, not at rest."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Shounak Ghosh", email = "subuddhi8@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "arxiv>=4.0.0",
    "chromadb>=1.5.9",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.44.0",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.58.0",
    "torchvision>=0.27.1",
]

[project.urls]
Repository = "https://github.com/Shounak-Ghosh/provenance-aware-rag"
Issues = "https://github.com/Shounak-Ghosh/provenance-aware-rag/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[project.optional-dependencies]
# Genuine in-toto Attestation Framework (ITE-6) export/verification (see
# src/intoto.py). Not needed for the rest of the app. Install with
# `uv sync --extra intoto`.
#   in-toto-attestation  Statement/ResourceDescriptor (protobuf) classes
#   securesystemslib[crypto]  DSSE Envelope + key/signer objects (the
#                              [crypto] extra pulls in `cryptography`,
#                              needed directly for Ed25519PrivateKey)
intoto = [
    "in-toto-attestation>=0.9.3",
    "securesystemslib[crypto]>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# E402: app.py/main.py/main_okf.py deliberately call load_dotenv() before any
# `src.*` import, since src.config reads env vars at import time.
ignore = ["E402"]
